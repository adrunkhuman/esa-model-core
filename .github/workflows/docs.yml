name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --only-group docs --no-install-project
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
      - name: Upload Pages artifact
        if: ${{ github.event.repository.visibility == 'public' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: ${{ github.event.repository.visibility == 'public' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
